<!-- Open this file in a browser to generate app icons -->
<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#1B5E20';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
  ctx.fill();
  // Text
  ctx.fillStyle = '#FFF8E1';
  ctx.font = `bold ${size*0.25}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌳', size/2, size/2 - size*0.1);
  ctx.font = `bold ${size*0.12}px Arial`;
  ctx.fillText('BB', size/2, size/2 + size*0.2);
}
const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
drawIcon(c192, 192);
drawIcon(c512, 512);

// Download links
function dl(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.textContent = 'Download ' + name;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
}
dl(c192, 'icon-192.png');
dl(c512, 'icon-512.png');
</script>
</body>
</html>
